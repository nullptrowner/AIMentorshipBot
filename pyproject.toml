[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "team-ai-bot"
version = "0.1.0"
description = "Private Telegram photo and video studio"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.25,<4", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "redis>=5.2,<7", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1",
  "jsonschema>=4.23,<5", "pillow>=11,<13", "python-dateutil>=2.9,<3",
  "structlog>=25,<27", "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-jsonschema", "types-python-dateutil"]

[project.scripts]
team-ai = "premium_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/premium_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires isolated PostgreSQL and Redis"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["premium_bot"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
